# STC Worldwide production deployment — chat.<domain> on netcup-vps-01
# Adapted from /docker-compose.yml + /docker/admin.yml upstream.
# Differences from upstream:
#   - pinned STC-built image from GHCR (built by .github/workflows/docker-publish.yml
#     on version tags; the GHCR package must be public or the VPS needs a pull token)
#   - Caddy terminates public TLS (80/443); traefik stays internal (loopback debug bind only)
#   - MinIO root credentials come from .env (symlink to docker-compose.env), not hard-coded
#   - /admin is served by server/admin-next as of v1.17.0 (the legacy react-admin app
#     was deleted; `command: pnpm start:admin` below now resolves to admin-next)
#
# The ONLY publicly exposed ports are Caddy's 80/443. Docker published ports
# bypass the host's default-deny nftables, so every other service must stay
# unpublished (loopback binds are fine).

services:
  service-core:
    image: ghcr.io/stc-worldwide/tailchat:1.22.0
    restart: unless-stopped
    env_file: docker-compose.env
    environment:
      SERVICES: core/gateway,core/admin,core/user/*.service.js,core/group/*.service.js,core/chat/*.service.js,core/file,core/plugin/registry,core/config
      PORT: 3000
    depends_on:
      - mongo
      - redis
      - minio
    healthcheck:
      # 127.0.0.1, not localhost: the gateway listens IPv4-only and busybox
      # wget resolves localhost to ::1 with no fallback -> permanent unhealthy,
      # and traefik drops unhealthy containers from routing.
      test: ["CMD", "wget", "http://127.0.0.1:3000/health", "-q", "-O", "-"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api-gw.rule=PathPrefix(`/`)"
      - "traefik.http.services.api-gw.loadbalancer.server.port=3000"
    networks:
      - internal

  service-openapi:
    image: ghcr.io/stc-worldwide/tailchat:1.22.0
    restart: unless-stopped
    env_file: docker-compose.env
    environment:
      SERVICES: openapi/app,openapi/bot,openapi/integration,openapi/oidc/oidc
      OPENAPI_PORT: 3003
      OPENAPI_UNDER_PROXY: "true"
    depends_on:
      - mongo
      - redis
      - minio
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.openapi-oidc.rule=PathPrefix(`/open`)"
      - "traefik.http.services.openapi-oidc.loadbalancer.server.port=3003"
    networks:
      - internal

  # Hosted MCP endpoint, so an agent needs no repo, no build and no Node — a client
  # points at https://<domain>/mcp and sends its own personal access token. The server
  # is stateless: every request builds its own MCP server from the token on that
  # request, so this process never holds anyone's credential between requests.
  #
  # Priority 50 like /admin, because api-gw claims PathPrefix(`/`).
  service-mcp:
    image: ghcr.io/stc-worldwide/tailchat:1.22.0
    restart: unless-stopped
    env_file: docker-compose.env
    environment:
      # The gateway, over the internal network — not the public origin, so this
      # does not hairpin out through Caddy and back.
      TAILCHAT_URL: http://service-core:3000
      # What agents are told they are connected to. Without it whoami would
      # report the internal hostname, which is meaningless to them.
      MCP_PUBLIC_URL: https://${CHAT_DOMAIN}
      MCP_HTTP_PORT: 3010
      MCP_HTTP_PATH: /mcp
    depends_on:
      - service-core
    healthcheck:
      test: ["CMD", "wget", "http://127.0.0.1:3010/healthz", "-q", "-O", "-"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mcp.rule=PathPrefix(`/mcp`)"
      - "traefik.http.routers.mcp.priority=50"
      - "traefik.http.services.mcp.loadbalancer.server.port=3010"
    networks:
      - internal
    command: node apps/tailchat-mcp/dist/src/http.js

  service-all-plugins:
    image: ghcr.io/stc-worldwide/tailchat:1.22.0
    restart: unless-stopped
    env_file: docker-compose.env
    environment:
      SERVICEDIR: plugins
    depends_on:
      - mongo
      - redis
      - minio
    networks:
      - internal

  tailchat-admin:
    image: ghcr.io/stc-worldwide/tailchat:1.22.0
    restart: unless-stopped
    env_file: docker-compose.env
    depends_on:
      - mongo
      - redis
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.admin.rule=PathPrefix(`/admin`)"
      - "traefik.http.routers.admin.priority=50"
      - "traefik.http.services.admin.loadbalancer.server.port=3000"
    networks:
      - internal
    command: pnpm start:admin

  mongo:
    # 4 -> 7 done 2026-08-31 by dump/restore into a fresh volume (mongo 7
    # cannot open 4.x data files in place). `data` holds the final mongo:4
    # state as rollback — see README-STC "MongoDB 4 -> 7 migration".
    image: mongo:7
    restart: on-failure
    volumes:
      - data7:/data/db
    networks:
      - internal

  redis:
    image: redis:alpine
    restart: on-failure
    networks:
      - internal

  minio:
    image: minio/minio
    restart: on-failure
    networks:
      - internal
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:?set MINIO_USER in .env (symlink docker-compose.env)}
      MINIO_ROOT_PASSWORD: ${MINIO_PASS:?set MINIO_PASS in .env (symlink docker-compose.env)}
    volumes:
      - storage:/data
    command: minio server /data --console-address ":9001"

  traefik:
    image: traefik:v3.7.8
    restart: unless-stopped
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entryPoints.web.address=:80"
      # Only Caddy can reach this entrypoint (internal network); headers it
      # forwards are trustworthy in this topology.
      - "--entryPoints.web.forwardedHeaders.insecure"
    ports:
      - 127.0.0.1:11000:80 # host-local debug access only
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - internal

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - traefik
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    environment:
      CHAT_DOMAIN: ${CHAT_DOMAIN:?set CHAT_DOMAIN in .env (symlink docker-compose.env)}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /opt/landing:/srv/landing:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - internal

networks:
  internal:
    name: tailchat-internal

volumes:
  data: # pre-migration mongo:4 data, kept as rollback
  data7:
  storage:
  caddy_data:
  caddy_config:
