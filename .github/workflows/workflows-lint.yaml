name: "Workflows Lint"

# Self-triggering paths get each of ci/admin/server-ci re-run when its OWN file
# changes, but three workflows can never validate themselves that way:
# docker-publish.yml and deploy.yml only run on master pushes and v*.*.* tags,
# and desktop-build.yml only fires on a desktop version bump. docker-publish.yml
# is the one that rolls production, so "no validation until it deploys" is the
# worst place to have this gap. actionlint covers all of them statically: YAML
# and expression syntax, `uses:` shapes, action input names against its own
# database (it would have caught a misspelled package-manager-cache), and
# shellcheck over every `run:` block.

# ── WHY THIS RUNS ON EVERY PR (do not add a `paths:` filter) ────────────────
# A `paths:` filter makes this workflow UNREQUIRABLE. GitHub only creates a
# check run for a workflow that actually triggers; when a path filter skips it,
# the required check is never reported and the PR sits "Expected — Waiting for
# status to be reported" forever. Adding a companion workflow with the inverse
# `paths-ignore:` does not fix it either -- a PR touching both sides fires BOTH,
# producing two check runs with the same name.
#
# actionlint is ~11 s on a hosted runner over the whole .github/workflows tree,
# so filtering it was never worth anything. Running unconditionally means the
# check is always present and always reports, which is what branch protection
# needs. It also means this file and .github/actionlint.yaml are linted by the
# thing they configure, without needing to be listed anywhere.

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: actionlint
        # Pinned image rather than a marketplace action: one less third-party
        # action in the supply chain, and the image bundles shellcheck so the
        # `run:` blocks are linted too. Custom runner labels (stc-vps) are
        # declared in .github/actionlint.yaml.
        run: |
          docker run --rm \
            -v "$PWD:/repo" --workdir /repo \
            rhysd/actionlint:1.7.12 -color
