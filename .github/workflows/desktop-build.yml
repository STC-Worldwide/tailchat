name: "Desktop Build"

on:
  push:
    branches:
      - master
    paths:
      - "client/desktop/release/app/package.json" # build when version upgrade
  workflow_dispatch:

jobs:
  build-desktop:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - macos-latest
          # - ubuntu-latest
          - windows-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7

      - name: Install Node.js, NPM and Yarn
        uses: actions/setup-node@v7
        with:
          # was 16, EOL since 2023-09. Matches the Dockerfile and the other
          # workflows, which have been on 22 since the v1.13.0 unfreeze.
          node-version: 22.x
          # See ci.yaml: pnpm/action-setup runs after this step, so
          # setup-node's >=v5 auto package-manager cache cannot find pnpm.
          package-manager-cache: false

      - name: Install global dependencies
        # pinned to the same major the other workflows use rather than
        # `latest`, so a pnpm release cannot change this build under us
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.8
          run_install: true

      - name: Enable corepack
        # client/desktop is yarn-managed and sits inside a repo whose ROOT
        # package.json declares `packageManager: pnpm@8.15.8`. yarn searches
        # upward, found that, and refused:
        #   error This project's package.json defines
        #   "packageManager": "yarn@pnpm@8.15.8"
        # which is why this workflow had never got past this step. client/desktop
        # now declares `packageManager: yarn@1.22.22` of its own to shadow the
        # root; corepack provisions exactly that version rather than relying on
        # whatever yarn the runner image happens to ship.
        run: corepack enable

      - name: Install npm dependencies
        # --frozen-lockfile now that yarn.lock matches package.json again: #32
        # dropped gh-pages, @types/gh-pages and fast-glob without regenerating
        # it, and #36 could not enforce the lockfile until that was fixed. The
        # flag makes a package.json/yarn.lock divergence fail the build instead
        # of being silently resolved away.
        run: yarn install --frozen-lockfile
        working-directory: ./client/desktop

      - name: Build/release Electron app
        # NOTE: unmaintained third-party action (last release v1.8.1) and it
        # still declares `runs: using: node16`, so the runner force-runs it on
        # a newer Node. Left as-is here because replacing how desktop builds
        # work is a bigger decision than this hygiene pass — but it is the
        # most likely thing to break the first time this workflow actually
        # fires, and it has never run on this fork.
        uses: paneron/action-electron-builder@v1.8.1
        with:
          package_root: ./client/desktop

          # GitHub token, automatically provided to the action
          # (No need to define this secret in the repo settings)
          github_token: ${{ secrets.github_token }}

          release: false
          # # If the commit is tagged with a version (e.g. "v1.0.0"),
          # # release the app after building
          # release: ${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Upload artifacts
        # v2 is switched off by GitHub entirely (v3 followed in Jan 2025), so
        # this step could not have succeeded as written. v4+ also requires
        # artifact names to be UNIQUE — the old name was shared by both matrix
        # legs, which would fail on the second uploader — hence the os suffix.
        uses: actions/upload-artifact@v7
        with:
          name: desktop-client-artifacts-${{ matrix.os }}
          path: ./client/desktop/release/build/*
