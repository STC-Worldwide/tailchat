name: "Docker Publish"

# Builds the STC-owned image on the self-hosted runner (netcup-vps-01,
# 12 cores + persistent local Docker layer cache) and publishes to GHCR with
# the workflow's own GITHUB_TOKEN. On version tags, the deploy job then rolls
# the production stack on the same host — no long-lived registry credentials
# anywhere.

on:
  push:
    branches:
      - master
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  dockerize:
    runs-on: [self-hosted, stc-vps]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        # docker driver (no buildx container builder): the daemon's local
        # layer cache persists between runs on this host.
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=docker-${{ github.ref_name }}

  deploy:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: dockerize
    runs-on: [self-hosted, stc-vps]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Login to GHCR
        # each job logs in itself: login-action logs out again in its
        # post-step, so nothing persists on the host between jobs
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify compose pin matches tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          grep -q "ghcr.io/stc-worldwide/tailchat:${TAG}" deploy/stc/docker-compose.yml \
            || { echo "compose pin does not match tag ${TAG} — update deploy/stc/docker-compose.yml first"; exit 1; }
      - name: Roll the stack
        run: |
          cp deploy/stc/docker-compose.yml /opt/tailchat/docker-compose.yml
          cp deploy/stc/Caddyfile /opt/tailchat/Caddyfile
          cd /opt/tailchat
          docker compose pull -q
          docker compose up -d
      - name: Smoke test
        run: |
          sleep 30
          docker compose -f /opt/tailchat/docker-compose.yml ps --format '{{.Name}} {{.Image}} {{.Status}}'
          for i in $(seq 1 10); do
            if wget -q -O /dev/null http://127.0.0.1:11000/health; then echo "health OK"; exit 0; fi
            sleep 10
          done
          echo "health endpoint never came up"; exit 1
