name: "Docker Publish"

# Builds the STC-owned image on the self-hosted runner (netcup-vps-01,
# 12 cores + persistent local Docker layer cache) and publishes to GHCR with
# the workflow's own GITHUB_TOKEN. On version tags, the deploy job then rolls
# the production stack on the same host — no long-lived registry credentials
# anywhere.

on:
  push:
    branches:
      - master
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  dockerize:
    runs-on: [self-hosted, stc-vps]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Docker meta
        # inline shell instead of docker/metadata-action: 2026-08-31 codeload
        # 400'd that action's archive for hours and blocked the release; this
        # computes the same tags (branch, semver, semver major.minor, sha)
        # with no marketplace dependency
        id: meta
        run: |
          IMAGE="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          TAGS="$IMAGE:sha-$(echo "$GITHUB_SHA" | cut -c1-7)"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            V="${GITHUB_REF_NAME#v}"
            TAGS="$TAGS,$IMAGE:$V,$IMAGE:${V%.*}"
          else
            TAGS="$TAGS,$IMAGE:$GITHUB_REF_NAME"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        # docker driver (no buildx container builder): the daemon's local
        # layer cache persists between runs on this host.
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: VERSION=docker-${{ github.ref_name }}

  deploy:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: dockerize
    runs-on: [self-hosted, stc-vps]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Login to GHCR
        # each job logs in itself: login-action logs out again in its
        # post-step, so nothing persists on the host between jobs
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify compose pin matches tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          grep -q "ghcr.io/stc-worldwide/tailchat:${TAG}" deploy/stc/docker-compose.yml \
            || { echo "compose pin does not match tag ${TAG} — update deploy/stc/docker-compose.yml first"; exit 1; }
      - name: Canary boot check
        # Boots the new image's gateway against the LIVE backends before any
        # traffic moves — catches runtime-only failures (the v1.13.0 moleculer
        # tracing crash) that no build-time gate can see. NAMESPACE=canary
        # isolates it from the production moleculer cluster on the shared
        # Redis transporter, so it registers no services and receives no
        # routed traffic.
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          IMG="ghcr.io/stc-worldwide/tailchat:${TAG}"
          docker pull -q "$IMG"
          docker rm -f tailchat-canary 2>/dev/null || true
          docker run -d --name tailchat-canary \
            --network tailchat-internal \
            --env-file /opt/tailchat/docker-compose.env \
            -e SERVICES=core/gateway \
            -e NAMESPACE=canary \
            -e PORT=3000 \
            "$IMG"
          ok=0
          for i in $(seq 1 12); do
            if docker exec tailchat-canary wget -q -O /dev/null http://127.0.0.1:3000/health; then ok=1; break; fi
            sleep 10
          done
          if [ "$ok" != 1 ]; then
            echo "::error::canary never became healthy — aborting deploy. Last logs:"
            docker logs --tail 60 tailchat-canary || true
            docker rm -f tailchat-canary
            exit 1
          fi
          docker rm -f tailchat-canary
          echo "canary healthy — proceeding"
      - name: Roll the stack
        run: |
          cp deploy/stc/docker-compose.yml /opt/tailchat/docker-compose.yml
          cp deploy/stc/Caddyfile /opt/tailchat/Caddyfile
          cd /opt/tailchat
          docker compose pull -q
          docker compose up -d
      - name: Smoke test
        # Two probes, both through traefik on the loopback debug bind. /health is
        # the gateway; /admin/ is the admin container, which the canary does NOT
        # cover (it boots SERVICES=core/gateway only). Since v1.17.0 /admin is
        # served by server/admin-next rather than the deleted server/admin, so a
        # gateway-only smoke test would let a crash-looping admin ship green.
        # /admin/ returns the SPA shell unauthenticated — auth() is applied
        # per-route on /admin/api, not to the shell — so a 200 here is the right
        # assertion.
        run: |
          sleep 30
          docker compose -f /opt/tailchat/docker-compose.yml ps --format '{{.Name}} {{.Image}} {{.Status}}'
          ok=0
          for i in $(seq 1 10); do
            if wget -q -O /dev/null http://127.0.0.1:11000/health; then ok=1; break; fi
            sleep 10
          done
          if [ "$ok" != 1 ]; then echo "::error::health endpoint never came up"; exit 1; fi
          echo "health OK"
          admin_ok=0
          for i in $(seq 1 10); do
            if wget -q -O /dev/null http://127.0.0.1:11000/admin/; then admin_ok=1; break; fi
            sleep 10
          done
          if [ "$admin_ok" != 1 ]; then
            echo "::error::/admin/ never came up — admin container is not serving. Last logs:"
            docker logs --tail 60 tailchat-admin 2>&1 || true
            exit 1
          fi
          echo "admin OK"
