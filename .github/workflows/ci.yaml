name: "CI"

on:
  push:
    branches:
      - master
    paths:
      - "client/web/**"
      - "client/shared/**"
      - "client/packages/design/**"
      # self: a change to this workflow must be exercised by this workflow,
      # otherwise workflow edits merge with no validation at all
      - ".github/workflows/ci.yaml"
  pull_request:
    branches:
      - master
    paths:
      - "client/web/**"
      - "client/shared/**"
      - "client/packages/design/**"
      # self: a change to this workflow must be exercised by this workflow,
      # otherwise workflow edits merge with no validation at all
      - ".github/workflows/ci.yaml"
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          # setup-node >=v5 auto-enables package-manager caching when
          # package.json has a "packageManager" field (ours is pnpm@8.15.8).
          # It runs pnpm to locate the store — but pnpm/action-setup comes
          # AFTER this step, so the auto-cache would fail with "Unable to
          # locate executable file: pnpm". The explicit actions/cache step
          # below already caches ~/.pnpm-store.
          package-manager-cache: false
      - name: Cache pnpm modules
        uses: actions/cache@v6
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-
      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.8
          run_install: false
      - name: Install packages
        run: pnpm install --frozen-lockfile
      - name: Check Type
        run: cd client/web && pnpm check:type
      - name: Test
        run: cd client/web && pnpm test
        env:
          TZ: Asia/Shanghai
      - name: Check Build
        run: cd client/web && pnpm build
