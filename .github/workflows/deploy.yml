name: "Deploy"

# Manual (re)deploy/rollback of an already-built image tag to production.
# Normal releases deploy automatically via the deploy job in
# docker-publish.yml when a v*.*.* tag is pushed.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Image version to deploy (e.g. 1.13.0) — must already exist in GHCR"
        required: true

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    runs-on: [self-hosted, stc-vps]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Canary boot check
        run: |
          V="${{ inputs.version }}"
          IMG="ghcr.io/stc-worldwide/tailchat:${V}"
          docker pull -q "$IMG"
          docker rm -f tailchat-canary 2>/dev/null || true
          docker run -d --name tailchat-canary \
            --network tailchat-internal \
            --env-file /opt/tailchat/docker-compose.env \
            -e SERVICES=core/gateway \
            -e NAMESPACE=canary \
            -e PORT=3000 \
            "$IMG"
          ok=0
          for _ in $(seq 1 12); do
            if docker exec tailchat-canary wget -q -O /dev/null http://127.0.0.1:3000/health; then ok=1; break; fi
            sleep 10
          done
          if [ "$ok" != 1 ]; then
            echo "::error::canary never became healthy — aborting deploy. Last logs:"
            docker logs --tail 60 tailchat-canary || true
            docker rm -f tailchat-canary
            exit 1
          fi
          docker rm -f tailchat-canary
          echo "canary healthy — proceeding"
      - name: Roll the stack to requested version
        run: |
          V="${{ inputs.version }}"
          cp deploy/stc/docker-compose.yml /opt/tailchat/docker-compose.yml
          cp deploy/stc/Caddyfile /opt/tailchat/Caddyfile
          sed -i "s|ghcr.io/stc-worldwide/tailchat:[0-9A-Za-z.-]*|ghcr.io/stc-worldwide/tailchat:${V}|g" /opt/tailchat/docker-compose.yml
          cd /opt/tailchat
          docker compose pull -q
          docker compose up -d
      - name: Smoke test
        run: |
          sleep 30
          docker compose -f /opt/tailchat/docker-compose.yml ps --format '{{.Name}} {{.Image}} {{.Status}}'
          for _ in $(seq 1 10); do
            if wget -q -O /dev/null http://127.0.0.1:11000/health; then echo "health OK"; exit 0; fi
            sleep 10
          done
          echo "health endpoint never came up"; exit 1
