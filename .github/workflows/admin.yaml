name: "Server Admin CI"

on:
  push:
    branches:
      - master
    paths:
      - "server/admin-next/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  pull_request:
    branches:
      - master
    paths:
      - "server/admin-next/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          # See ci.yaml: pnpm/action-setup runs after this step, so
          # setup-node's >=v5 auto package-manager cache cannot find pnpm.
          package-manager-cache: false
      - name: Cache pnpm modules
        uses: actions/cache@v6
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-
      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.8
          run_install: false
      - name: Install packages
        run: pnpm install --frozen-lockfile
      - name: Test
        # admin-next ships tests (node:test) that no workflow ran until now.
        # They cover getAdminPort and the legacy-admin redirect — i.e. the
        # port/route contract that keeps /admin reachable behind the traefik
        # `loadbalancer.server.port=3000` label. Since v1.17.0 /admin is
        # served by admin-next, so this contract is load-bearing in prod.
        run: cd server/admin-next && pnpm test
      - name: Check Build
        run: pnpm build:admin
